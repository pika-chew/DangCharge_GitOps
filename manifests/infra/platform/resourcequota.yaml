# 이 쿼터가 있으면 네임스페이스의 모든 Pod에 requests·limits를 지정해야 한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dangcharge-quota
  namespace: dangcharge # TODO: 업무 네임스페이스 이름 확정
spec:
  hard:
    # TODO: 노드 사양에 맞춰 한도 확정
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    persistentvolumeclaims: "4"
