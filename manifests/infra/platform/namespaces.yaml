apiVersion: v1
kind: Namespace
metadata:
  name: dangcharge # TODO: 업무 네임스페이스 이름 확정
  annotations:
    # Namespace 삭제가 DB와 PVC 보존 정책을 우회하지 않도록 Argo CD 삭제를 막는다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  annotations:
    # Preserve the namespace while LoadBalancer Services depend on MetalLB.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    # Speaker needs host networking and raw packets to advertise VIPs.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
