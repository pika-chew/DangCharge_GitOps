apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik-vip
  namespace: metallb-system
spec:
  # Reserved by the unbound Neutron port k8s-metallb-vip-port.
  addresses:
    - 10.10.0.50/32
  # Existing LoadBalancer Services must not claim this address automatically.
  autoAssign: false
  serviceAllocation:
    namespaces:
      - traefik
    serviceSelectors:
      - matchLabels:
          app.kubernetes.io/name: traefik
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: argocd-vip
  namespace: metallb-system
spec:
  # Reserved by a separate unbound Neutron port for the Argo CD UI.
  addresses:
    - 10.10.0.51/32
  # The argocd-server Service requests this address by annotation.
  autoAssign: false
  serviceAllocation:
    namespaces:
      - argocd
    serviceSelectors:
      - matchLabels:
          app.kubernetes.io/name: argocd-server
