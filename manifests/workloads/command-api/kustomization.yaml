apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangcharge

resources:
  - deployment.yaml
  - service.yaml

# 주소 설정은 ConfigMap, 비밀번호는 기존 Secret 참조로 분리한다.
configMapGenerator:
  - name: command-api-config
    literals:
      - DB_URL=jdbc:mysql://mysql.dangcharge.svc:3306/dangcharge
# 기본 이름 hash를 유지해 설정 변경 시 Pod template 참조도 변경되게 한다.

images:
  - name: command-api
    # GitHub Organization Package의 프로듀서 이미지를 사용한다.
    newName: ghcr.io/pika-chew/dangcharge-be-producer
    # Jenkins는 이 항목만 갱신하도록 후속 단계에서 연결한다.
    newTag: "f66d00f"

# 초기 API는 1개로 유지한다. HPA 리소스는 포함하지 않는다.
