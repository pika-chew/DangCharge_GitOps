# 확인 코드: producer develop 90aa99c65f44bebfef7b9f0161d6902b2b42eeb3
# Spring Boot + Java 17, Dockerfile EXPOSE 8080, DB_URL/DB_USERNAME/DB_PASSWORD.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: command-api
  labels:
    app.kubernetes.io/name: command-api
    app.kubernetes.io/component: producer
spec:
  replicas: 2
  revisionHistoryLimit: 3
  # TODO: 실제 DB 연결·앱 시작 시간을 측정해 조정.
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: command-api
  # 블루-그린 전환 중에는 blue와 green의 outbox relay가 함께 실행된다.
  # relay는 FOR UPDATE SKIP LOCKED로 행을 나눠 중복 발행하지 않고, 역순은 consumer의 version 비교가 거른다.
  # ddl-auto: update로 green 기동 시 공유 MySQL 스키마가 바뀐다. 엔티티 변경은 팀 규칙에 따라 하위 호환으로 한다.
  strategy:
    blueGreen:
      # api-routing Ingress가 가리키는 Service. promote 시 selector가 green으로 바뀐다.
      activeService: command-api
      # promote 전 green 확인용. 클러스터 안이나 port-forward로만 접근한다.
      previewService: command-api-preview
      # green 확인 후 Argo CD UI 또는 kubectl argo rollouts promote로 전환한다.
      autoPromotionEnabled: false
      # 전환 후 blue를 잠시 유지해 즉시 되돌릴 수 있게 한다.
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: command-api
        app.kubernetes.io/component: producer
      # 이미지 변경 없이 Pod 템플릿만 바꿔 블루-그린 배포를 일으킨다. 테스트 회차마다 값을 바꾼다.
      annotations:
        dangcharge/test-run: bg-02
    spec:
      # 앱에서 Kubernetes API를 사용하지 않으므로 토큰 자동 마운트를 끈다.
      automountServiceAccountToken: false
      # TODO: graceful shutdown과 진행 중 요청 처리 시간을 확인해 조정.
      terminationGracePeriodSeconds: 30
      containers:
        - name: producer
          # Kustomize images에서 실제 경로와 태그 또는 digest로 교체한다.
          image: command-api:replace-me-commit-tag
          imagePullPolicy: IfNotPresent
          # 실행 명령은 이미지 ENTRYPOINT(java -jar /app/app.jar)를 사용한다.
          ports:
            - name: http
              containerPort: 8080
          env:
            # Spring Boot 실행 포트를 Service와 맞춘다. 실제 이미지 기동으로 확인해야 한다.
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_CONTEXT_PATH
              value: "/"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: command-api-config
                  key: DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-app
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-app
                  key: MYSQL_PASSWORD
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: producer-secrets
                  key: ADMIN_API_KEY
            # 키가 없으면 앱이 임시 키를 만들어 재시작·promote 때마다 토큰이 무효가 된다.
            # JWT_PUBLIC_KEY는 consumer-secrets의 JWT_PUBLIC_KEY와 같은 키 쌍이어야 한다.
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: producer-secrets
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: producer-secrets
                  key: JWT_PUBLIC_KEY
            # 앱의 outbox relay가 outbox_events를 폴링해 Kafka로 직접 발행한다.
            # 토픽은 dangcharge.{aggregateType}이다. 브로커가 없으면 전송을 재시도하며 이벤트는 DB에 남는다.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: command-api-config
                  key: KAFKA_BOOTSTRAP_SERVERS
          # TODO: CORS 등 실제 앱 구현에 필요한 설정과 Secret만 추가.
          # producer PR #21의 actuator 경로. readiness는 DB 연결을 포함하고 liveness는 포함하지 않는다.
          # DB 일시 장애를 liveness 실패로 연결하면 불필요한 재시작이 반복될 수 있다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # TODO: 제안값. Java heap·native memory·실측 부하·Quota에 맞춰 조정.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # TODO: 이미지의 숫자 UID/GID 확인 후 runAsNonRoot 등 실행 권한 설정.
            # 현재 Dockerfile USER app은 숫자 UID가 아니므로 runAsNonRoot만 넣지 않는다.
      # TODO: GHCR 패키지가 비공개이면 준비된 imagePullSecrets를 추가.
      # TODO: Spring의 테이블 생성 방식 확인. ddl-auto=validate만으로는 생성되지 않는다.
