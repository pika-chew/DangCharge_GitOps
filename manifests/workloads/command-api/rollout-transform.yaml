# Kustomize는 Rollout(CRD)의 ConfigMap 참조를 모른다.
# configMapGenerator의 hash 이름을 Rollout template에도 반영하도록 경로를 알려준다.
nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - path: spec/template/spec/containers/env/valueFrom/configMapKeyRef/name
        kind: Rollout
      - path: spec/template/spec/containers/envFrom/configMapRef/name
        kind: Rollout
      - path: spec/template/spec/volumes/configMap/name
        kind: Rollout
