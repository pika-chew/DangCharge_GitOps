apiVersion: v1
kind: Service
metadata:
  name: command-api
  labels:
    app.kubernetes.io/name: command-api
    app.kubernetes.io/component: producer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: command-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
# 외부 경로는 api-routing Ingress에서 경로 변환 없이 연결한다.
