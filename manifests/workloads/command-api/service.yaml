apiVersion: v1
kind: Service
metadata:
  name: command-api
  labels:
    app.kubernetes.io/name: command-api
    app.kubernetes.io/component: producer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: command-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
# 외부 경로·prefix 변환은 후속 Ingress 단계에서 확정한다.
