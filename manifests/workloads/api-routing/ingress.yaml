apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-routing
  annotations:
    # web은 HTTP를 유지하고 websecure는 entryPoint의 TLS 설정을 사용한다.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: dangcharge-api-prefix@kubernetescrd
  labels:
    app.kubernetes.io/name: api-routing
    app.kubernetes.io/component: routing
spec:
  ingressClassName: traefik
  rules:
    - host: api.dangcharge.cloud
      http:
        paths:
          - path: /command
            pathType: Prefix
            backend:
              service:
                name: command-api
                port:
                  name: http
          - path: /query
            pathType: Prefix
            backend:
              service:
                name: query-api
                port:
                  name: http

# api-prefix가 앱 구분 접두어를 제거한다. 내부 API 경로는 그대로 유지한다.
# JWT 인증, 관리 API 권한과 CORS는 앱에서 처리한다.
# Cloudflare Tunnel의 기존 HTTP origin과 VIP:443 HTTPS 테스트를 함께 지원한다.
