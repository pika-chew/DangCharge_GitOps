apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dangcharge

resources:
  - deployment.yaml
  - service.yaml

# consumer application.yaml에서 읽는 환경 변수 이름을 사용한다.
configMapGenerator:
  - name: query-api-config
    literals:
      # DangCharge_Infra의 Kafka 외부 listener. 배포 전 Pod에서 연결을 확인한다.
      - KAFKA_BOOTSTRAP_SERVERS=10.10.0.32:9092
      # 앱 기본값과 일치시킨다. 변경하면 기존 그룹 offset을 이어 쓰지 않는다.
      # 새 그룹은 앱의 auto-offset-reset=earliest에 따라 처음부터 재처리한다.
      - KAFKA_CONSUMER_GROUP_ID=dangcharge-consumer
# 기본 이름 hash를 유지해 설정 변경 시 Deployment의 참조도 함께 변경한다.

images:
  - name: query-api
    # consumer Jenkinsfile의 IMAGE_REPO와 일치한다.
    newName: ghcr.io/pika-chew/dangcharge-be-consumer
    # 이미지 push 후 Jenkins가 실제 커밋 태그로 갱신한다. 교체 전에는 Sync하지 않는다.
    newTag: "5b2e238"

# Kafka 소비와 조회 API를 Pod 1개로 운용하며 HPA는 포함하지 않는다.
