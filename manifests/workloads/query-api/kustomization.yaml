apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO: Application destination 및 MongoDB Namespace와 함께 확정.
namespace: replace-me-workloads-namespace

resources:
  - deployment.yaml
  - service.yaml

# 환경 변수 이름은 consumer develop application.yaml의 placeholder와 맞춘다.
configMapGenerator:
  - name: query-api-config
    literals:
      # 클러스터 밖 kafka-1 VM의 EXTERNAL 리스너 (Infra ansible/roles/kafka). PLAINTEXT, 인증 없음.
      - KAFKA_BOOTSTRAP_SERVERS=10.10.0.32:9092
      # 앱 기본값과 같다. group ID를 바꾸면 기존 그룹 offset을 이어 쓰지 않는다.
      # 처음 붙는 그룹은 auto-offset-reset=earliest로 토픽 처음부터 다시 읽는다.
      - KAFKA_CONSUMER_GROUP_ID=dangcharge-consumer
      # 토픽(dangcharge.station·reservation·user)은 앱 코드에 고정돼 있다.
      # 처리 실패 메시지는 앱이 5분 재시도 후 {토픽}.DLT로 보낸다.
# 기본 이름 hash를 유지해 설정 변경 시 Deployment의 참조도 함께 변경한다.

images:
  - name: query-api
    # TODO: Dockerfile/빌드 방식과 Docker Hub의 실제 이미지 경로를 확정.
    newName: replace-me-dockerhub-namespace/replace-me-query-api-image
    # TODO: 빌드된 이미지의 고정 커밋 태그로 교체하거나 newTag 대신 digest 사용.
    newTag: replace-me-commit-tag

# 초기 consumer/query는 하나의 Pod 1개로 가정하며 HPA는 포함하지 않는다.
# TODO: 실제 구현이 Kafka 소비와 조회 API로 분리되면 배포 구성을 다시 정한다.
