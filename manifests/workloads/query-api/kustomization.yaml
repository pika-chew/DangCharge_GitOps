apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# TODO: Application destination 및 MongoDB Namespace와 함께 확정.
namespace: replace-me-workloads-namespace

resources:
  - deployment.yaml
  - service.yaml

# Spring Boot 4.1 표준 설정 이름을 제안한다. 실제 앱 계약으로 확정한 것은 아니다.
# 현재 consumer에 Kafka 의존성·리스너가 없으므로 이 설정만으로 이벤트를 소비하지 않는다.
configMapGenerator:
  - name: query-api-config
    literals:
      # TODO: 외부 Kafka의 실제 bootstrap 서버 목록으로 변경.
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=replace-me-kafka-bootstrap-servers
      # TODO: 안정적으로 유지할 실제 consumer group ID로 변경.
      # group ID를 바꾸면 기존 그룹 offset을 이어 쓰지 않는다.
      # TODO: 새 그룹의 시작 위치와 재처리·누락 영향을 확인.
      - SPRING_KAFKA_CONSUMER_GROUP_ID=replace-me-consumer-group
      # TODO: 토픽과 앱이 읽는 환경 변수 이름은 구현 확인 후 추가.
      # TODO: Kafka 인증 방식·TLS·security protocol을 확정하고 Secret 참조로 추가.
      # TODO: listener concurrency·offset commit·retry·DLQ·중복 처리 정책 확인.
# 기본 이름 hash를 유지해 설정 변경 시 Deployment의 참조도 함께 변경한다.

images:
  - name: query-api
    # TODO: Dockerfile/빌드 방식과 Docker Hub의 실제 이미지 경로를 확정.
    newName: replace-me-dockerhub-namespace/replace-me-query-api-image
    # TODO: 빌드된 이미지의 고정 커밋 태그로 교체하거나 newTag 대신 digest 사용.
    newTag: replace-me-commit-tag

# 초기 consumer/query는 하나의 Pod 1개로 가정하며 HPA는 포함하지 않는다.
# TODO: 실제 구현이 Kafka 소비와 조회 API로 분리되면 배포 구성을 다시 정한다.
