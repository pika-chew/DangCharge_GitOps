# 확인 코드: consumer develop fe7187338c7bf35649aee5311656c3aeb74ae905
# Spring Boot 4.1.1 + Java 17. application.yaml, Kafka/JWT 설정, Dockerfile을 확인했다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: query-api
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # TODO: 앱 시작·MongoDB 연결 시간을 실측해 조정.
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: query-api
  # 블루-그린 전환 중에는 blue와 green이 함께 실행되어 둘 다 Kafka를 소비한다.
  # 같은 consumer group이라 파티션은 나뉘고, 중복·역순 이벤트는 앱의 replaceIfNewer(version 비교)가 거른다.
  # MongoDB 문서 구조 변경은 구버전 조회 API가 읽을 수 있도록 하위 호환으로 한다.
  strategy:
    blueGreen:
      # api-routing Ingress가 가리키는 Service. promote 시 selector가 green으로 바뀐다.
      activeService: query-api
      # promote 전 green 확인용. 클러스터 안이나 port-forward로만 접근한다.
      previewService: query-api-preview
      # green 확인 후 Argo CD UI 또는 kubectl argo rollouts promote로 전환한다.
      autoPromotionEnabled: false
      # 전환 후 blue를 잠시 유지해 즉시 되돌릴 수 있게 한다.
      scaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-api
        app.kubernetes.io/component: consumer
      # 이미지 변경 없이 Pod 템플릿만 바꿔 블루-그린 배포를 일으킨다. 테스트 회차마다 값을 바꾼다.
      annotations:
        dangcharge/test-run: bg-05
    spec:
      automountServiceAccountToken: false
      # TODO: 진행 중 이벤트 완료·offset 기록·listener 종료 시간에 맞춰 조정.
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          # Kustomize images에서 실제 경로와 태그 또는 digest로 교체한다.
          image: query-api:replace-me-commit-tag
          imagePullPolicy: IfNotPresent
          # 이미지 ENTRYPOINT(java -jar /app/app.jar)를 사용한다.
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_CONTEXT_PATH
              value: "/"
            # consumer는 SERVER_CONTEXT_PATH를 직접 참조하지 않아 표준 설정도 지정한다.
            # Ingress가 /query를 제거하므로 앱의 context path는 /로 유지한다.
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-app
                  key: MONGODB_URI
            # scripts/mongodb/create-secrets.sh가 rs0의 세 멤버와 앱 계정 URI를 생성한다.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: query-api-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: query-api-config
                  key: KAFKA_CONSUMER_GROUP_ID
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  # producer가 토큰 서명에 사용하는 키 쌍의 공개키만 공급한다.
                  name: consumer-secrets
                  key: JWT_PUBLIC_KEY
          # consumer feat/health-probes의 actuator 경로. 해당 커밋이 포함된 이미지로 배포해야 한다.
          # readiness는 MongoDB 연결을 포함하고, liveness는 포함하지 않아 MongoDB 장애로 재시작하지 않는다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            # TODO: 제안값. Java heap·native memory·이벤트 처리 부하·Quota에 맞춰 조정.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # TODO: 최종 이미지 숫자 UID/GID 확인 후 runAsNonRoot 등 실행 권한 설정.
      # TODO: GHCR 패키지가 비공개이면 준비된 imagePullSecrets를 추가.
