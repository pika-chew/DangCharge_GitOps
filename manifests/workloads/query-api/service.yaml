apiVersion: v1
kind: Service
metadata:
  name: query-api
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/component: consumer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
# 외부 URL과 prefix 처리는 후속 Ingress 단계에서 확정한다.
