apiVersion: v1
kind: Service
metadata:
  name: query-api
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/component: consumer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
# api-routing Ingress가 /query를 제거하고 내부 API 경로를 유지한다.
