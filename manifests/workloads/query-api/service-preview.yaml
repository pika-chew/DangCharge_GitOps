apiVersion: v1
kind: Service
metadata:
  name: query-api-preview
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/component: consumer
spec:
  type: ClusterIP
  # Argo Rollouts가 rollouts-pod-template-hash를 추가해 green Pod만 선택한다.
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
# Ingress에 연결하지 않는다. promote 전 확인은 port-forward로 한다.
