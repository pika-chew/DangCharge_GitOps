# 확인 코드: consumer develop fe71873 (Kafka 리스너·환경 변수 이름만 대조)
# Spring Boot 4.1.1 + Java 17. Kafka 리스너와 Dockerfile은 develop에 있다.
# TODO: 이미지·MongoDB Secret·Namespace 확정 전까지 실행 가능한 배포가 아니다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  # 초기 업데이트에서 기존·새 consumer의 동시 실행을 피한다.
  # 재배포 중 조회 API와 Kafka 소비가 중단된다. HPA는 적용하지 않는다.
  # TODO: 실제 group·파티션·중복 처리 정책 확인 후 무중단 배포 요구를 결정.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  # TODO: 앱 시작·MongoDB 연결 시간을 실측해 조정. 자동 rollback은 하지 않는다.
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: query-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-api
        app.kubernetes.io/component: consumer
    spec:
      automountServiceAccountToken: false
      # TODO: 진행 중 이벤트 완료·offset 기록·listener 종료 시간에 맞춰 조정.
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          # Kustomize images에서 실제 경로와 태그 또는 digest로 교체한다.
          image: query-api:replace-me-commit-tag
          imagePullPolicy: IfNotPresent
          # TODO: Dockerfile/ENTRYPOINT와 실제 앱 실행 방식을 확인.
          # 확인되지 않은 JAR 경로나 시작 명령을 지정하지 않는다.
          ports:
            - name: http
              # 명시한 SERVER_PORT에 맞춘 제안값이며 이미지 실행으로 확인해야 한다.
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            # Boot 4.1의 spring.mongodb.uri 표준 이름을 제안한다.
            # TODO: 최종 앱의 환경 변수 계약과 맞춘다.
            - name: SPRING_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  # TODO: MongoDB customUsers의 앱 Secret에 MONGODB_URI 항목을 추가.
                  name: replace-me-mongodb-app-secret
                  key: MONGODB_URI
            # URI는 앱 계정·업무 DB와 세 멤버 DNS, replicaSet, authSource를 포함해야 한다.
            # TODO: 사용자명·암호 URI 인코딩, rs0·cluster domain·TLS 계약 확인.
            # 자격증명을 포함한 전체 URI는 ConfigMap이나 Git에 평문으로 넣지 않는다.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: query-api-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: query-api-config
                  key: KAFKA_CONSUMER_GROUP_ID
          # TODO: JWT 검증 공개키(JWT_PUBLIC_KEY) 등 실제 구현에 필요한 Secret 참조를 추가.
          # MongoDB 변경은 중복 이벤트에도 안전해야 한다. Pod 1개도 재처리가 발생할 수 있다.
          # TODO: 실제 HTTP startup/readiness 계약 확정 후 교체. TCP는 포트 개방만 검사한다.
          # MongoDB 접속이나 Kafka 소비·projection 준비 상태를 보장하는 검사가 아니다.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # TODO: 앱 생존 검사 endpoint 확정 후 livenessProbe 추가.
          # MongoDB/Kafka 일시 장애를 생존 검사 실패로 연결하지 않는다.
          resources:
            # TODO: 제안값. Java heap·native memory·이벤트 처리 부하·Quota에 맞춰 조정.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # TODO: 최종 이미지 숫자 UID/GID 확인 후 runAsNonRoot 등 실행 권한 설정.
      # TODO: 비공개 Docker Hub 이미지이면 준비된 imagePullSecrets를 추가.
