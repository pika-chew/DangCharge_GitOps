# 확인 코드: consumer develop fe7187338c7bf35649aee5311656c3aeb74ae905
# Spring Boot 4.1.1 + Java 17. application.yaml, Kafka/JWT 설정, Dockerfile을 확인했다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  # 초기 업데이트에서 기존·새 consumer의 동시 실행을 피한다.
  # 재배포 중 조회 API와 Kafka 소비가 중단된다. HPA는 적용하지 않는다.
  # TODO: 실제 group·파티션·중복 처리 정책 확인 후 무중단 배포 요구를 결정.
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  # TODO: 앱 시작·MongoDB 연결 시간을 실측해 조정. 자동 rollback은 하지 않는다.
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: query-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-api
        app.kubernetes.io/component: consumer
    spec:
      automountServiceAccountToken: false
      # TODO: 진행 중 이벤트 완료·offset 기록·listener 종료 시간에 맞춰 조정.
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          # Kustomize images에서 실제 경로와 태그 또는 digest로 교체한다.
          image: query-api:replace-me-commit-tag
          imagePullPolicy: IfNotPresent
          # 이미지 ENTRYPOINT(java -jar /app/app.jar)를 사용한다.
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_CONTEXT_PATH
              value: "/"
            # consumer는 SERVER_CONTEXT_PATH를 직접 참조하지 않아 표준 설정도 지정한다.
            # Ingress가 /query를 제거하므로 앱의 context path는 /로 유지한다.
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-app
                  key: MONGODB_URI
            # scripts/mongodb/create-secrets.sh가 rs0의 세 멤버와 앱 계정 URI를 생성한다.
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: query-api-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: query-api-config
                  key: KAFKA_CONSUMER_GROUP_ID
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  # producer가 토큰 서명에 사용하는 키 쌍의 공개키만 공급한다.
                  name: consumer-secrets
                  key: JWT_PUBLIC_KEY
          # MongoDB 변경은 중복 이벤트에도 안전해야 한다. Pod 1개도 재처리가 발생할 수 있다.
          # TODO: 실제 HTTP startup/readiness 계약 확정 후 교체. TCP는 포트 개방만 검사한다.
          # MongoDB 접속이나 Kafka 소비·projection 준비 상태를 보장하는 검사가 아니다.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          # TODO: 앱 생존 검사 endpoint 확정 후 livenessProbe 추가.
          # MongoDB/Kafka 일시 장애를 생존 검사 실패로 연결하지 않는다.
          resources:
            # TODO: 제안값. Java heap·native memory·이벤트 처리 부하·Quota에 맞춰 조정.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # TODO: 최종 이미지 숫자 UID/GID 확인 후 runAsNonRoot 등 실행 권한 설정.
      # TODO: GHCR 패키지가 비공개이면 준비된 imagePullSecrets를 추가.
