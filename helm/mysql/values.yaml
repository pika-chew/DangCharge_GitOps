# groundhog2k/mysql 3.0.11 전용. 미확정 계약이 남은 검토용 초안이다.
# 공식 이미지: https://hub.docker.com/_/mysql
# CDC 기준: https://debezium.io/documentation/reference/stable/connectors/mysql.html
fullnameOverride: mysql
useDeployment: false

image:
  registry: docker.io
  repository: mysql
  # 조회한 multi-architecture manifest digest를 고정한다.
  tag: "8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6"
  pullPolicy: IfNotPresent

customAnnotations:
  # 수동 prune 및 Application 삭제 시에도 StatefulSet 보존. 백업을 대신하지 않는다.
  argocd.argoproj.io/sync-options: Prune=false,Delete=false

service:
  type: ClusterIP
  port: 3306
  # TODO: 외부 Debezium 사설 접속·출발지 제한·TLS 합의 필요.
  # 이 Service만으로 클러스터 밖 Kafka VM 접속은 제공되지 않는다.

storage:
  volumeName: db-volume
  # TODO: 20Gi는 제안값. 데이터·binlog 용량과 local PV 크기 확인.
  requestedSize: 20Gi
  # TODO: local PV에 연결하는 실제 StorageClass 이름.
  className: replace-me-mysql-storage-class
  accessModes:
    - ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # TODO: PV reclaimPolicy=Retain, nodeAffinity, 디렉터리 소유권 확인.
  # local PV 노드 장애 시 단일 MySQL이 중단된다. 별도 백업·복구 계획 필요.

settings:
  # TODO: 같은 Namespace에 사전 공급할 root Secret 이름.
  existingSecret: replace-me-mysql-root-secret
  rootPassword:
    secretKey: MYSQL_ROOT_PASSWORD
  allowEmptyRootPassword: false

userDatabase:
  # TODO: DB 이름·앱 계정·암호 Secret 이름과 키 확정.
  # 값은 Git에 넣지 않는다. 공식 entrypoint가 DB와 앱 계정을 최초 생성한다.
  # 이 방식은 앱 계정에 해당 DB의 ALL 권한을 부여하므로 최소 권한 조정도 필요하다.
  existingSecret: replace-me-mysql-app-secret
  name:
    secretKey: MYSQL_DATABASE
  user:
    secretKey: MYSQL_USER
  password:
    secretKey: MYSQL_PASSWORD

env:
  - name: MYSQL_CDC_USERNAME
    valueFrom:
      secretKeyRef:
        name: replace-me-mysql-cdc-secret
        key: MYSQL_CDC_USERNAME
  - name: MYSQL_CDC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: replace-me-mysql-cdc-secret
        key: MYSQL_CDC_PASSWORD
  - name: MYSQL_CDC_HOST
    valueFrom:
      secretKeyRef:
        name: replace-me-mysql-cdc-secret
        key: MYSQL_CDC_HOST
  # TODO: CDC Secret 이름·키를 확정한다.
  # MYSQL_CDC_HOST는 MySQL에서 실제 보이는 접속 출발지 IP다. SNAT 여부 확인.
  # '%'로 열지 않는다. 방화벽 제한과 TLS는 별도로 설정해야 한다.

customConfig: |
  [mysqld]
  # TODO: 다른 MySQL·Debezium client와 충돌하지 않는 ID.
  server-id=101
  log-bin=/var/lib/mysql/mysql-bin
  binlog-format=ROW
  binlog-row-image=FULL
  binlog-row-value-options=
  # TODO: 7일 제안값. CDC 최대 중단 시간과 20Gi 디스크 용량에 맞춘다.
  binlog-expire-logs-seconds=604800
  max-binlog-size=104857600
  # 트랜잭션·binlog 내구성 설정. 물리 호스트 장애 복구를 보장하지 않는다.
  sync-binlog=1
  innodb-flush-log-at-trx-commit=1
  # TODO: 부하 측정 후 메모리·버퍼 크기 조정.
  innodb-buffer-pool-size=256M
  character-set-server=utf8mb4
  collation-server=utf8mb4_unicode_ci
  default-time-zone=+00:00

# TODO: 합의된 최초 스키마를 가진 ConfigMap으로 변경.
# producer ddl-auto=validate이므로 DB 이름 생성만으로 API가 준비되지 않는다.
# 이 ConfigMap은 아직 작성하지 않았다. 존재하지 않으면 Pod 기동을 막는다.
# 최초 스키마는 빈 datadir에서만 실행된다. 이후 변경은 별도 migration으로 수행한다.
extraScripts: replace-me-mysql-schema-configmap

customScripts:
  90-create-cdc-user.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    # 공식 entrypoint가 빈 datadir를 초기화할 때만 실행한다.
    # 기존 PVC에서는 Secret 변경으로 계정·비밀번호가 갱신되지 않는다.
    : "${MYSQL_ROOT_PASSWORD:?root Secret required}"
    : "${MYSQL_DATABASE:?application database required}"
    : "${MYSQL_USER:?application user required}"
    : "${MYSQL_CDC_USERNAME:?CDC username required}"
    : "${MYSQL_CDC_PASSWORD:?CDC password required}"
    : "${MYSQL_CDC_HOST:?CDC source IP required}"
    [[ "$MYSQL_DATABASE" =~ ^[A-Za-z0-9_]+$ ]] || exit 1
    [[ "$MYSQL_CDC_USERNAME" =~ ^[A-Za-z0-9_]{1,32}$ ]] || exit 1
    [[ "$MYSQL_CDC_HOST" =~ ^[0-9a-fA-F:.]+$ ]] || exit 1
    [[ "$MYSQL_CDC_USERNAME" != root && "$MYSQL_CDC_USERNAME" != "$MYSQL_USER" ]] || exit 1
    # SQL에서 backslash를 일반 문자로 처리하고 작은따옴표는 두 번 쓴다.
    # 비밀번호는 인자·로그로 보내지 않는다. 끝 표시로 마지막 개행도 보존한다.
    cdc_password="$(printf '%s.' "$MYSQL_CDC_PASSWORD" | sed "s/'/''/g")"
    cdc_password="${cdc_password%.}"
    MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=socket --user=root <<SQL
    SET SESSION sql_mode = 'NO_BACKSLASH_ESCAPES';
    CREATE USER '${MYSQL_CDC_USERNAME}'@'${MYSQL_CDC_HOST}' IDENTIFIED BY '${cdc_password}';
    GRANT SELECT ON \`${MYSQL_DATABASE}\`.* TO '${MYSQL_CDC_USERNAME}'@'${MYSQL_CDC_HOST}';
    GRANT RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO '${MYSQL_CDC_USERNAME}'@'${MYSQL_CDC_HOST}';
    SQL
    # TODO: snapshot 방식에 따라 LOCK TABLES 등 추가 권한 확인.
    # 초기화 중 실패하면 단순 재시작으로 완료 처리하지 않는다. 데이터 확인 후 수동 복구.

# 초기화용 임시 서버를 준비 완료로 오인하지 않도록 TCP 연결로 SQL 실행을 검사한다.
customStartupProbe:
  exec:
    command:
      - bash
      - -ec
      - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=3 --batch --skip-column-names -e "SELECT 1"'
  periodSeconds: 10
  timeoutSeconds: 5
  # TODO: 초기 데이터량에 맞춰 조정. 기동 대기 한도는 약 10분.
  failureThreshold: 60

customReadinessProbe:
  exec:
    command:
      - bash
      - -ec
      - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=3 --batch --skip-column-names -e "SELECT 1"'
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

customLivenessProbe:
  exec:
    command:
      - bash
      - -ec
      - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=3 ping --silent'
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# TODO: 제안 초기값을 Quota와 실측 부하에 맞춰 조정한다.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
initResources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
