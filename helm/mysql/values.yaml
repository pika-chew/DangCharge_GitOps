# groundhog2k/mysql 3.0.11 전용. 미확정 계약이 남은 검토용 초안이다.
# 공식 이미지: https://hub.docker.com/_/mysql
# 이벤트 발행은 앱의 outbox relay가 담당한다. Debezium CDC는 사용하지 않는다.
fullnameOverride: mysql
useDeployment: false

image:
  registry: docker.io
  repository: mysql
  # 조회한 multi-architecture manifest digest를 고정한다.
  tag: "8.4.10@sha256:8dbcf531a03aade657e181b9cf2f1d1803ce621a1d55610cb44cb531ab7d7db6"
  pullPolicy: IfNotPresent

customAnnotations:
  # 수동 prune 및 Application 삭제 시에도 StatefulSet 보존. 백업을 대신하지 않는다.
  argocd.argoproj.io/sync-options: Prune=false,Delete=false

service:
  type: ClusterIP
  port: 3306

storage:
  # StatefulSet mysql의 PVC 이름을 local PV 예약 data-mysql-0과 맞춘다.
  volumeName: data
  requestedSize: 10Gi
  className: local-storage
  accessModes:
    - ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  # TODO: PV reclaimPolicy=Retain, nodeAffinity, 디렉터리 소유권 확인.
  # local PV 노드 장애 시 단일 MySQL이 중단된다. 별도 백업·복구 계획 필요.

settings:
  # 배포 전 scripts/mysql/create-secrets.sh로 같은 Namespace에 공급한다.
  existingSecret: mysql-root
  rootPassword:
    secretKey: MYSQL_ROOT_PASSWORD
  allowEmptyRootPassword: false

userDatabase:
  # TODO: 실제 DB 이름과 앱 계정을 확정해 Secret 공급 시 입력.
  # 값은 Git에 넣지 않는다. 공식 entrypoint가 DB와 앱 계정을 최초 생성한다.
  # 이 방식은 앱 계정에 해당 DB의 ALL 권한을 부여하므로 최소 권한 조정도 필요하다.
  existingSecret: mysql-app
  name:
    secretKey: MYSQL_DATABASE
  user:
    secretKey: MYSQL_USER
  password:
    secretKey: MYSQL_PASSWORD

customConfig: |
  [mysqld]
  # binlog는 시점 복구(PITR)용으로 유지한다.
  server-id=101
  log-bin=/var/lib/mysql/mysql-bin
  binlog-format=ROW
  binlog-row-image=FULL
  binlog-row-value-options=
  # TODO: 7일 제안값. 백업 주기와 10Gi 디스크 용량에 맞춘다.
  binlog-expire-logs-seconds=604800
  max-binlog-size=104857600
  # 트랜잭션·binlog 내구성 설정. 물리 호스트 장애 복구를 보장하지 않는다.
  sync-binlog=1
  innodb-flush-log-at-trx-commit=1
  # TODO: 부하 측정 후 메모리·버퍼 크기 조정.
  innodb-buffer-pool-size=256M
  character-set-server=utf8mb4
  collation-server=utf8mb4_unicode_ci
  default-time-zone=+00:00

# 업무 테이블은 Spring의 초기화/migration에서 생성한다. DB Chart는 빈 DB와 계정만 준비한다.
# TODO: 앱의 테이블 생성 방식과 필요한 DDL 권한 확인.
extraScripts: ""

# 초기화용 임시 서버를 준비 완료로 오인하지 않도록 TCP 연결로 SQL 실행을 검사한다.
customStartupProbe:
  exec:
    command:
      - bash
      - -ec
      - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=3 --batch --skip-column-names -e "SELECT 1"'
  periodSeconds: 10
  timeoutSeconds: 5
  # TODO: 초기 데이터량에 맞춰 조정. 기동 대기 한도는 약 10분.
  failureThreshold: 60

customReadinessProbe:
  exec:
    command:
      - bash
      - -ec
      - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=3 --batch --skip-column-names -e "SELECT 1"'
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

customLivenessProbe:
  exec:
    command:
      - bash
      - -ec
      - 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqladmin --protocol=TCP --host=127.0.0.1 --user=root --connect-timeout=3 ping --silent'
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

# TODO: 제안 초기값을 Quota와 실측 부하에 맞춰 조정한다.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi
initResources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
