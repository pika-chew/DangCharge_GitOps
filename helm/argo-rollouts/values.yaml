# https://github.com/argoproj/argo-helm/blob/main/charts/argo-rollouts/values.yaml
controller:
  # 기본값 2는 leader election용 대기 복제본이다. 소규모 클러스터라 1개로 운용한다.
  replicas: 1
  resources:
    # TODO: 제안값. Rollout 수와 실측 사용량에 맞춰 조정.
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# 전환·promote는 Argo CD UI와 kubectl argo rollouts 플러그인으로 한다.
dashboard:
  enabled: false

notifications:
  # 토큰은 Git에 두지 않는다. argo-rollouts-notification-secret(slack-token 키)을 직접 만들고
  # app.kubernetes.io/component=rollouts-controller 라벨을 붙인다.
  secret:
    create: false
  notifiers:
    service.slack: |
      token: $slack-token
  # 차트는 트리거·템플릿을 만들지 않는다. v1.10.1 notifications-install.yaml의 정의를 바탕으로 한다.
  templates:
    template.rollout-paused: |
      message: |
        :large_blue_circle: *{{.rollout.metadata.name}}* green이 떠서 promote를 기다립니다.
        `kubectl argo rollouts promote {{.rollout.metadata.name}} -n {{.rollout.metadata.namespace}}`
      slack:
        attachments: |
          [{
            "color": "#2EB6F0",
            "fields": [
            {{range $index, $c := .rollout.spec.template.spec.containers}}
              {{if $index}},{{end}}
              {"title": "{{$c.name}}", "value": "{{$c.image}}", "short": true}
            {{end}}
            ]
          }]
    template.rollout-completed: |
      message: ":large_green_circle: *{{.rollout.metadata.name}}* 전환이 완료됐습니다."
      slack:
        attachments: |
          [{
            "color": "#18BE52",
            "fields": [
            {{range $index, $c := .rollout.spec.template.spec.containers}}
              {{if $index}},{{end}}
              {"title": "{{$c.name}}", "value": "{{$c.image}}", "short": true}
            {{end}}
            ]
          }]
    template.rollout-aborted: |
      message: ":red_circle: *{{.rollout.metadata.name}}* 배포가 abort됐습니다. blue를 유지합니다. Git에서 이미지 태그를 되돌리세요."
      slack:
        attachments: |
          [{
            "color": "#E01E5A",
            "fields": [
            {{range $index, $c := .rollout.spec.template.spec.containers}}
              {{if $index}},{{end}}
              {"title": "{{$c.name}}", "value": "{{$c.image}}", "short": true}
            {{end}}
            ]
          }]
  # 이벤트 기반 트리거라 조건(when) 없이 보낼 템플릿만 지정한다.
  triggers:
    trigger.on-rollout-paused: |
      - send: [rollout-paused]
    trigger.on-rollout-completed: |
      - send: [rollout-completed]
    trigger.on-rollout-aborted: |
      - send: [rollout-aborted]
  # 모든 Rollout에 적용한다.
  subscriptions:
    - recipients:
        # 봇(DangCharge CD)이 #argocd 채널에 초대되어 있어야 한다.
        - slack:argocd
      triggers:
        # green 기동 완료, promote 대기
        - on-rollout-paused
        # promote 후 전환 완료
        - on-rollout-completed
        # abort됨
        - on-rollout-aborted
