# https://github.com/argoproj/argo-helm/blob/main/charts/argo-rollouts/values.yaml
controller:
  # 기본값 2는 leader election용 대기 복제본이다. 소규모 클러스터라 1개로 운용한다.
  replicas: 1
  resources:
    # TODO: 제안값. Rollout 수와 실측 사용량에 맞춰 조정.
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# 전환·promote는 Argo CD UI와 kubectl argo rollouts 플러그인으로 한다.
dashboard:
  enabled: false

notifications:
  # 토큰은 Git에 두지 않는다. argo-rollouts-notification-secret(slack-token 키)을 직접 만들고
  # app.kubernetes.io/component=rollouts-controller 라벨을 붙인다.
  secret:
    create: false
  notifiers:
    service.slack: |
      token: $slack-token
  # 모든 Rollout에 적용한다. 메시지는 컨트롤러 기본 템플릿을 쓴다.
  subscriptions:
    - recipients:
        # 봇(DangCharge CD)이 #argocd 채널에 초대되어 있어야 한다.
        - slack:argocd
      triggers:
        # green 기동 완료, promote 대기
        - on-rollout-paused
        # promote 후 전환 완료
        - on-rollout-completed
        # abort됨
        - on-rollout-aborted
