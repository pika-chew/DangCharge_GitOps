# groundhog2k/mongodb 0.8.3 전용. 서버 준비와 bootstrap Job 검증 후 수동 동기화한다.
fullnameOverride: mongodb
image:
  # TODO: 앱 드라이버 호환성 확인.
  registry: docker.io
  repository: mongo
  tag: 8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
  pullPolicy: IfNotPresent
customAnnotations:
  # Namespace 보호·PVC/PV Retain과 함께 사용한다. 백업은 별도다.
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
# Pod가 직접 primary를 탐색하지 않도록 entrypoint를 바꾸고 별도 Job에서 RS를 구성한다.
podManagementPolicy: Parallel
updateStrategyType: RollingUpdate
replicaSet:
  enabled: true
  name: rs0
  secondaries: 2
  arbiter:
    enabled: false
  hiddenSecondaries:
    instances: 0
  # 공유 멤버 인증 키는 배포 전 Secret으로 공급한다.
  keySecretName: mongodb-keyfile
  # CoreDNS에서 확인한 도메인. Job과 Secret URI도 같은 값을 사용한다.
  clusterDomain: cluster.local
service:
  type: ClusterIP
  port: 27017
  headlessServiceSuffix: headless
storage:
  # 인프라에 예약한 datadir-mongodb-0/1/2 이름을 유지한다.
  volumeName: datadir
  requestedSize: 10Gi
  className: local-storage
  accessModes:
    - ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-1
                - worker-2
                - worker-3
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
            - key: node-role.kubernetes.io/master
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: mongodb
            app.kubernetes.io/instance: mongodb
            service-type: primary-secondary
        topologyKey: kubernetes.io/hostname
settings: {}
# 기본 스크립트는 set -u로 실행된다. 빈 값으로 내장 사용자 생성을 건너뛴다.
userDatabase: {}
env:
  - name: USERDB_USER
    value: ""
  - name: USERDB_PASSWORD
    value: ""
  - name: HOME
    value: /tmp
  - name: MONGO_INITDB_ROOT_USERNAME
    valueFrom:
      secretKeyRef:
        name: mongodb-root
        key: MONGO_INITDB_ROOT_USERNAME
  - name: MONGO_INITDB_ROOT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mongodb-root
        key: MONGO_INITDB_ROOT_PASSWORD
  - name: MONGO_INITDB_DATABASE
    valueFrom:
      secretKeyRef:
        name: mongodb-app
        key: MONGO_APP_DATABASE
  - name: MONGO_APP_USERNAME
    valueFrom:
      secretKeyRef:
        name: mongodb-app
        key: MONGO_APP_USERNAME
  - name: MONGO_APP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: mongodb-app
        key: MONGO_APP_PASSWORD
  - name: MONGO_APP_DATABASE
    valueFrom:
      secretKeyRef:
        name: mongodb-app
        key: MONGO_APP_DATABASE
  - name: MONGODB_REPLICA_SET
    value: rs0
extraInitContainers:
  # URI 인코딩 없이 사용할 암호: 첫 글자 영숫자, 전체 영숫자/_/-, 32자 이상.
  - name: validate-credentials
    image: docker.io/mongo:8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    command:
      - bash
      - -ec
      - |
        [[ "$ROOT_PASSWORD" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{31,}$ ]] || exit 1
        [[ "$APP_PASSWORD" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{31,}$ ]] || exit 1
        [[ "$ROOT_USERNAME" =~ ^[A-Za-z0-9_]{1,64}$ ]] || exit 1
        [[ "$ROOT_PASSWORD" != "$APP_PASSWORD" ]] || exit 1
        [[ "$APP_USERNAME" =~ ^[A-Za-z0-9_]{1,64}$ ]] || exit 1
        [[ "$APP_DATABASE" =~ ^[A-Za-z0-9_]{1,64}$ ]] || exit 1
        [[ "$APP_DATABASE" != admin && "$APP_DATABASE" != local && "$APP_DATABASE" != config ]] || exit 1
        [[ "$APP_USERNAME" != "$ROOT_USERNAME" ]] || exit 1
    env:
      - name: ROOT_USERNAME
        valueFrom:
          secretKeyRef:
            name: mongodb-root
            key: MONGO_INITDB_ROOT_USERNAME
      - name: ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mongodb-root
            key: MONGO_INITDB_ROOT_PASSWORD
      - name: APP_USERNAME
        valueFrom:
          secretKeyRef:
            name: mongodb-app
            key: MONGO_APP_USERNAME
      - name: APP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mongodb-app
            key: MONGO_APP_PASSWORD
      - name: APP_DATABASE
        valueFrom:
          secretKeyRef:
            name: mongodb-app
            key: MONGO_APP_DATABASE
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  # 차트의 키·설정 준비는 유지하고 DNS/primary 자동 탐색만 별도 Job으로 분리한다.
  - name: prepare-entrypoint
    image: docker.io/mongo:8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    command:
      - bash
      - -ec
      - |
        cat > /extrainitscripts/entrypoint.new <<'SH'
        #!/usr/bin/env bash
        set -euo pipefail
        exec docker-entrypoint.sh "$@"
        SH
        chmod 0555 /extrainitscripts/entrypoint.new
        mv -f /extrainitscripts/entrypoint.new /extrainitscripts/extra-init.sh
    volumeMounts:
      - name: extrainitscripts
        mountPath: /extrainitscripts
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
# 앱 계정은 빈 데이터 디렉터리에 의존하지 않고 bootstrap Job에서 준비한다.
customScripts: {}
# TODO: TLS/NetworkPolicy, cache·oplog 크기는 실제 부하에 맞춰 확정.
customConfig: |
  net:
    bindIpAll: true
    port: 27017
  storage:
    dbPath: /data/db
    wiredTiger:
      engineConfig:
        cacheSizeGB: 0.25
  replication:
    oplogSizeMB: 1024
customStartupProbe:
  exec:
    command:
      - mongosh
      - mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000
      - --quiet
      - --eval
      - const a=db.getSiblingDB("admin"); const r=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(r!==1&&r?.ok!==1) quit(1); const o=a.runCommand({getCmdLineOpts:1}); const n=o.parsed?.replication?.replSetName??o.parsed?.replication?.replSet; quit(o.ok===1&&n===process.env.MONGODB_REPLICA_SET&&a.runCommand({ping:1}).ok===1?0:1);
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
# 임시 초기화 서버를 제외하고 최종 mongod의 인증·ping을 검사한다.
# RS 준비는 Sync hook Job이 1 PRIMARY + 2 SECONDARY를 확인해야 완료다.
customReadinessProbe:
  exec:
    command:
      - mongosh
      - mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000
      - --quiet
      - --eval
      - const a=db.getSiblingDB("admin"); const r=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(r!==1&&r?.ok!==1) quit(1); const o=a.runCommand({getCmdLineOpts:1}); const n=o.parsed?.replication?.replSetName??o.parsed?.replication?.replSet; quit(o.ok===1&&n===process.env.MONGODB_REPLICA_SET&&a.runCommand({ping:1}).ok===1?0:1);
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
customLivenessProbe:
  exec:
    command:
      - mongosh
      - mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000
      - --quiet
      - --eval
      - const a=db.getSiblingDB("admin"); const r=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(r!==1&&r?.ok!==1) quit(1); quit(a.runCommand({ping:1}).ok===1?0:1);
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
# TODO: 실제 메모리·CPU 사용량과 종료 시간을 측정해 조정.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 2Gi
initResources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
