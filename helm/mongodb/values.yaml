# groundhog2k/mongodb 0.8.3 전용 검토 초안. 실제 동기화는 준비 검증 후 진행한다.
# 공식 MongoDB 이미지와 digest를 고정한다.
fullnameOverride: mongodb
image:
  # TODO: VM의 AVX와 앱 드라이버 호환성 확인.
  registry: docker.io
  repository: mongo
  tag: 8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
  pullPolicy: IfNotPresent
customAnnotations:
  # StatefulSet 보존 정책이다. Namespace 보호와 별도 백업도 필요하다.
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
# 첫 Pod의 초기화 후 다음 멤버를 시작한다. 동시 초기화 경쟁을 피한다.
# TODO: 첫 RS 초기화·전체 재기동 시 차트 초기화의 DNS/primary 탐색을 검증.
podManagementPolicy: OrderedReady
updateStrategyType: RollingUpdate
replicaSet:
  enabled: true
  name: rs0
  secondaries: 2
  arbiter:
    enabled: false
  hiddenSecondaries:
    instances: 0
  # TODO: 같은 Namespace에 공유 keyfile Secret 공급.
  keySecretName: replace-me-mongodb-keyfile-secret
  # TODO: 실제 CoreDNS cluster domain 확인.
  clusterDomain: cluster.local
  extraInit:
    retries: 60
    delay: 5
    initDelay: 5
  # TODO: 기본 Pod 종료 유예와 실제 primary 선출 시간을 확인.
  shutdown:
    delay: 10
service:
  type: ClusterIP
  port: 27017
  headlessServiceSuffix: headless
storage:
  # 인프라에 예약한 datadir-mongodb-0/1/2 이름을 유지한다.
  volumeName: datadir
  requestedSize: 10Gi
  className: local-storage
  accessModes:
    - ReadWriteOnce
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - worker-1
                - worker-2
                - worker-3
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
            - key: node-role.kubernetes.io/master
              operator: DoesNotExist
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: mongodb
            app.kubernetes.io/instance: mongodb
            service-type: primary-secondary
        topologyKey: kubernetes.io/hostname
settings: {}
# 자격증명은 아래 env의 Secret 참조로만 공급한다.
userDatabase: {}
# USERDB_USER/PASSWORD를 쓰지 않아 dbAdmin을 주는 내장 스크립트는 건너뛴다.
env:
  # TODO: root/app Secret 이름, DB명과 계정 확정.
  - name: MONGO_INITDB_ROOT_USERNAME
    value: replace_me_mongodb_admin
  - name: MONGO_INITDB_ROOT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: replace-me-mongodb-root-secret
        key: MONGO_INITDB_ROOT_PASSWORD
  - name: MONGO_INITDB_DATABASE
    valueFrom:
      secretKeyRef:
        name: replace-me-mongodb-app-secret
        key: MONGO_APP_DATABASE
  - name: MONGO_APP_USERNAME
    valueFrom:
      secretKeyRef:
        name: replace-me-mongodb-app-secret
        key: MONGO_APP_USERNAME
  - name: MONGO_APP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: replace-me-mongodb-app-secret
        key: MONGO_APP_PASSWORD
  - name: MONGO_APP_DATABASE
    valueFrom:
      secretKeyRef:
        name: replace-me-mongodb-app-secret
        key: MONGO_APP_DATABASE
  - name: MONGODB_REPLICA_SET
    value: rs0
extraInitContainers:
  # 차트의 문자열 삽입 제약 때문에 암호는 영숫자/_/- 32자 이상으로 제한한다.
  # TODO: root 계정 이름 변경 시 guard의 동일 계정 검사도 변경.
  - name: validate-credentials
    image: docker.io/mongo:8.0.26@sha256:3ce3de7f40e914034b03b7dec654005ab54f7dc8306937e44ec6760d9e9409a1
    imagePullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    command:
      - bash
      - -ec
      - |
        [[ "$ROOT_PASSWORD" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{31,}$ ]] || exit 1
        [[ "$APP_PASSWORD" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{31,}$ ]] || exit 1
        [[ "$APP_USERNAME" =~ ^[A-Za-z0-9_]{1,64}$ ]] || exit 1
        [[ "$APP_DATABASE" =~ ^[A-Za-z0-9_]{1,64}$ ]] || exit 1
        [[ "$APP_DATABASE" != admin && "$APP_DATABASE" != local && "$APP_DATABASE" != config ]] || exit 1
        [[ "$APP_USERNAME" != replace_me_mongodb_admin ]] || exit 1
    env:
      - name: ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: replace-me-mongodb-root-secret
            key: MONGO_INITDB_ROOT_PASSWORD
      - name: APP_USERNAME
        valueFrom:
          secretKeyRef:
            name: replace-me-mongodb-app-secret
            key: MONGO_APP_USERNAME
      - name: APP_PASSWORD
        valueFrom:
          secretKeyRef:
            name: replace-me-mongodb-app-secret
            key: MONGO_APP_PASSWORD
      - name: APP_DATABASE
        valueFrom:
          secretKeyRef:
            name: replace-me-mongodb-app-secret
            key: MONGO_APP_DATABASE
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
customScripts:
  02-init-app-user.js: |
    // Only mongodb-0 runs this script on an empty datadir.
    const database = process.env.MONGO_APP_DATABASE;
    const username = process.env.MONGO_APP_USERNAME;
    const password = process.env.MONGO_APP_PASSWORD;
    if (!database || !username || !password) throw new Error("Application credentials required");
    db.getSiblingDB(database).createUser({
      user: username,
      pwd: password,
      roles: [{role: "readWrite", db: database}]
    });

# TODO: TLS/NetworkPolicy, cache·oplog 크기는 실제 부하에 맞춰 확정.
customConfig: |
  net:
    bindIpAll: true
    port: 27017
  storage:
    dbPath: /data/db
    wiredTiger:
      engineConfig:
        cacheSizeGB: 0.25
  replication:
    oplogSizeMB: 1024
customStartupProbe:
  exec:
    command:
      - mongosh
      - mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000
      - --quiet
      - --eval
      - const a=db.getSiblingDB("admin"); const r=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(r!==1&&r?.ok!==1) quit(1); quit(a.runCommand({ping:1}).ok===1?0:1);
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60
# headless Service는 Ready Pod만 DNS에 올린다. 초기화 진행용으로 인증·ping을 검사한다.
# 이 probe는 RS 과반수/PRIMARY·SECONDARY 상태를 보증하지 않는다. 배포 검증에서 별도 확인한다.
customReadinessProbe:
  exec:
    command:
      - mongosh
      - mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000
      - --quiet
      - --eval
      - const a=db.getSiblingDB("admin"); const r=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(r!==1&&r?.ok!==1) quit(1); quit(a.runCommand({ping:1}).ok===1?0:1);
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
customLivenessProbe:
  exec:
    command:
      - mongosh
      - mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000
      - --quiet
      - --eval
      - const a=db.getSiblingDB("admin"); const r=a.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(r!==1&&r?.ok!==1) quit(1); quit(a.runCommand({ping:1}).ok===1?0:1);
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 2Gi
initResources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
