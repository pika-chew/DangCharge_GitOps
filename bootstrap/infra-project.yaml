# 인프라 프로젝트: 플랫폼 구성에 필요한 클러스터 리소스를 허용한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infra
  namespace: argocd
spec:
  description: Namespace, ResourceQuota, Storage, Traefik, metrics-server, MetalLB, Argo Rollouts
  sourceRepos:
    - https://github.com/pika-chew/DangCharge_GitOps.git
    - https://traefik.github.io/charts
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://metallb.github.io/metallb
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dangcharge # TODO: 업무 네임스페이스 이름 확정
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: kube-system
    - server: https://kubernetes.default.svc
      namespace: metallb-system
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
    - group: storage.k8s.io
      kind: StorageClass
    # Traefik, metrics-server, Argo Rollouts 차트가 만드는 클러스터 리소스
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: networking.k8s.io
      kind: IngressClass
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: apiregistration.k8s.io
      kind: APIService
    # MetalLB validates its configuration through an admission webhook.
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
