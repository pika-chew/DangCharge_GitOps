# apps/ 아래의 Application을 재귀 탐색해 생성한다 (app of apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: root
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      # 조회 앱과 공개 라우팅은 배포 준비가 끝난 뒤 포함한다.
      exclude: '{workloads/query-api.yaml,workloads/api-routing.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
