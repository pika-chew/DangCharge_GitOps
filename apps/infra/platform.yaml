apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: infra
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    targetRevision: main
    path: manifests/infra/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge # TODO: 업무 네임스페이스 이름 확정
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
