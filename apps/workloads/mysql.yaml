# 초안: Secret·스토리지·배포 대상 확인 전 수동 Sync하지 않는다.
# Chart: https://github.com/groundhog2k/helm-charts/releases/tag/mysql-3.0.11
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql
  namespace: argocd
  annotations:
    # TODO: 설치된 Argo CD 지원과 배포 준비 확인 후 제거.
    # root는 이 Application을 읽는다. 자동 sync는 별도로 활성화하지 않는다.
    argocd.argoproj.io/skip-reconcile: "true"
  # 삭제 시 DB를 연쇄 삭제하는 resources-finalizer를 의도적으로 넣지 않는다.
spec:
  project: workloads
  sources:
    - repoURL: https://groundhog2k.github.io/helm-charts/
      chart: mysql
      targetRevision: 3.0.11
      helm:
        releaseName: mysql
        valueFiles:
          - $values/helm/mysql/values.yaml
    - repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
      # 변경사항은 main 병합 후 반영된다.
      targetRevision: main
      ref: values
  destination:
    # TODO: Argo CD와 동일 클러스터인지 확인
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # 자동 sync와 auto-prune을 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
