# 초안: 계약 확정 전 root Application에 연결하거나 수동 Sync하지 않는다.
# Chart: https://github.com/groundhog2k/helm-charts/releases/tag/mysql-3.0.11
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysql
  # TODO: Argo CD Application이 있는 Namespace로 변경
  namespace: replace-me-argocd-namespace
  annotations:
    # TODO: 설치된 Argo CD에서 지원 확인 후 확정 시 제거
    # skip-reconcile은 alpha 기능이며, 실제 배포 차단은 root 미연결로 유지한다.
    argocd.argoproj.io/skip-reconcile: "true"
  # 삭제 시 DB를 연쇄 삭제하는 resources-finalizer를 의도적으로 넣지 않는다.
spec:
  # TODO: workload 배포를 허용하는 AppProject 이름
  project: replace-me-workloads-project
  sources:
    - repoURL: https://groundhog2k.github.io/helm-charts/
      chart: mysql
      targetRevision: 3.0.11
      helm:
        releaseName: mysql
        valueFiles:
          - $values/helm/mysql/values.yaml
    - repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
      # TODO: PR 병합 후 root 앱 추적 브랜치와 맞춘다
      targetRevision: feat/k8s-workloads
      ref: values
  destination:
    # TODO: Argo CD와 동일 클러스터인지 확인
    server: https://kubernetes.default.svc
    # TODO: 기존 Namespace 사용. 자동 생성하지 않는다.
    namespace: replace-me-workloads-namespace
  # 자동 sync와 auto-prune을 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
