# 프로듀서의 외부 라우팅을 등록하며, 최초 적용은 수동 Sync로 진행한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-routing
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    targetRevision: main
    path: manifests/workloads/api-routing
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # API가 배포됐다는 사실만으로 실제 요청 경로가 준비됐다고 판단하지 않는다.
  # 자동 sync와 auto-prune은 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
