# root가 등록하며, 실제 배포는 수동 Sync로 진행한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: command-api
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    # 변경사항은 main 병합 후 반영된다.
    targetRevision: main
    path: manifests/workloads/command-api
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # DB 생성 순서에 의존하지 않는다. 실제 앱의 연결 재시도·readiness 구현이 필요하다.
  # 최초 배포에서 이미지 pull, DB 연결, 상태 검사와 실제 API를 확인한다.
  # 자동 sync와 auto-prune은 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
