# root가 등록한다. main 변경은 자동 Sync되고, 트래픽 전환은 Rollout의 수동 promote로 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: command-api
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    # 변경사항은 main 병합 후 반영된다.
    targetRevision: main
    path: manifests/workloads/command-api
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # DB 생성 순서에 의존하지 않는다. 실제 앱의 연결 재시도·readiness 구현이 필요하다.
  # 자동 Sync는 green 기동까지만 한다. blue-green 전환은 preview 확인 후 promote한다.
  # selfHeal이 클러스터 직접 변경을 되돌리므로 롤백은 kubectl argo rollouts undo가 아닌 Git revert로 한다.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
