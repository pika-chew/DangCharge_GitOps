# 초안: Secret·저장 경로·CPU 확인 전 수동 Sync하지 않는다.
# Chart: https://github.com/groundhog2k/helm-charts/releases/tag/mongodb-0.8.3
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
  annotations:
    # TODO: Secret·스토리지·CPU 준비 확인 후 제거.
    # 자동 sync를 켜지 않는다. 이 설정은 부모 앱의 Application 생성을 막지 않는다.
    argocd.argoproj.io/skip-reconcile: "true"
  # DB 연쇄 삭제를 피하기 위해 resources-finalizer를 추가하지 않는다.
spec:
  project: workloads
  sources:
    - repoURL: https://groundhog2k.github.io/helm-charts/
      chart: mongodb
      targetRevision: 0.8.3
      helm:
        releaseName: mongodb
        valueFiles:
          - $values/helm/mongodb/values.yaml
    - repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
      # 변경사항은 main 병합 후 반영된다.
      targetRevision: main
      ref: values
      path: manifests/workloads/mongodb-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # 자동 sync와 auto-prune은 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
