# 이미지 태그·Secret·연결 검증 전 root 연결 또는 Sync하지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: query-api
  namespace: argocd
  annotations:
    # 이미지와 배포 전제 조건이 준비되면 제거한다. root의 exclude도 함께 해제한다.
    argocd.argoproj.io/skip-reconcile: "true"
spec:
  project: workloads
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    # 변경사항은 main 병합 후 반영된다.
    targetRevision: main
    path: manifests/workloads/query-api
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # DB/Kafka 준비 순서만 믿지 않고 앱 자체 재시도·readiness 구현을 확인해야 한다.
  # 자동 sync와 auto-prune은 초안에서 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
