# root가 등록하며, 이미지·Secret·연결 준비를 확인한 뒤 수동 Sync한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: query-api
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/pika-chew/DangCharge_GitOps.git
    # 변경사항은 main 병합 후 반영된다.
    targetRevision: main
    path: manifests/workloads/query-api
  destination:
    server: https://kubernetes.default.svc
    namespace: dangcharge
  # DB/Kafka 준비 순서만 믿지 않고 앱 자체 재시도·readiness 구현을 확인해야 한다.
  # 자동 sync와 auto-prune은 초안에서 활성화하지 않는다.
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
